<!doctype html><html><meta charset="utf-8"><title>Local ChatGPT UI fixture — no model calls</title><style>body{font:16px system-ui;padding:25px}button{padding:8px;margin:4px}#prompt-textarea{border:1px solid;padding:16px;min-height:40px;white-space:pre-wrap}[role=menu],[role=listbox]{border:1px solid;background:#fff;padding:10px}section{margin:15px} [data-prompt-link-href]{background:#eee;padding:3px}</style><body>
<h1>Offline UI fixture</h1><button data-testid="model-switcher-dropdown-button" data-model-id="m1" id="model">Model One</button><button data-testid="thinking-effort-dropdown-button" data-thinking-effort="standard" id="thinking">Standard</button>
<main id="messages"></main><form onsubmit="return false"><div id="prompt-textarea" contenteditable="true" role="textbox"></div><button data-testid="send-button" type="button" id="send">Send</button></form>
<script>
window.fixtureLocation = { href: 'https://chatgpt.com/', pathname: '/', hostname: 'chatgpt.com', origin: window.location.origin };
const models=[{id:'m1',label:'Model One',thinkingOptions:[{id:'standard',label:'Standard'},{id:'extended',label:'Extended'}]},{id:'m2',label:'Model Two',thinkingOptions:[]}];
const apps=[{id:'asdk_app_a',label:'Development Mac'},{id:'asdk_app_b',label:'Tasks'}];
const box=document.querySelector('#prompt-textarea');let seq=0,replyTimer;window.fixtureSends=0;window.fixtureLong=false;
function dismiss(){document.querySelectorAll('[role=menu],[role=listbox]').forEach(n=>n.remove())}
function menu(options,kind,onSelect){dismiss();const panel=document.createElement('div');panel.role=kind==='app'?'listbox':'menu';for(const o of options){const b=document.createElement('button');b.role=kind==='app'?'option':'menuitem';b.textContent=o.label;b.setAttribute(kind==='model'?'data-model-id':kind==='thinking'?'data-thinking-effort':'data-app-id',o.id);b.onclick=()=>{onSelect(o);dismiss()};panel.append(b)}document.body.append(panel)}
function chooseModel(o){model.textContent=o.label;model.setAttribute('data-model-id',o.id);thinking.style.display=o.thinkingOptions.length?'':'none';if(o.thinkingOptions.length){thinking.setAttribute('data-thinking-effort',o.thinkingOptions[0].id);thinking.textContent=o.thinkingOptions[0].label}}
model.onclick=()=>menu(models,'model',chooseModel);
thinking.onclick=()=>menu(models.find(m=>m.id===model.getAttribute('data-model-id')).thinkingOptions,'thinking',o=>{thinking.textContent=o.label;thinking.setAttribute('data-thinking-effort',o.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')dismiss()});
box.addEventListener('input',()=>{if(box.textContent.trim().endsWith('@'))menu(apps,'app',o=>{const walker=document.createTreeWalker(box,NodeFilter.SHOW_TEXT);let n,last;while(n=walker.nextNode())last=n;if(last)last.textContent=last.textContent.replace(/@\s*$/,'');const chip=document.createElement('span');chip.setAttribute('data-prompt-link-href','app://'+o.id);chip.contentEditable='false';chip.textContent=o.label;const rm=document.createElement('button');rm.type='button';rm.textContent='×';rm.onclick=()=>chip.remove();chip.append(rm);box.append(chip);})});
// Independent test editor serializer: paragraph and BR boundaries are newlines; app tokens are not authored words.
function plain(){const clone=box.cloneNode(true);clone.querySelectorAll('[data-prompt-link-href],[app-mention-path]').forEach(n=>n.remove());const walk=n=>n.nodeType===3?n.nodeValue:n.nodeType===1?(n.tagName==='BR'?'\n':([...n.childNodes].map(walk).join('')+(['P','DIV'].includes(n.tagName)?'\n':''))):'';return [...clone.childNodes].map(walk).join('').trim();}
send.onclick=()=>{window.fixtureSends++;const message=plain();box.replaceChildren();if(!fixtureLocation.pathname.includes('/c/')){fixtureLocation.pathname='/c/00000000-0000-4000-8000-'+String(window.fixtureId || '1').padStart(12,'0');fixtureLocation.href='https://chatgpt.com'+fixtureLocation.pathname;if(window.fixtureRealRoute)history.replaceState({},'',fixtureLocation.pathname);}const n=++seq;
 const user=document.createElement('section');user.setAttribute('data-testid','conversation-turn-'+n);const row=document.createElement('div');row.setAttribute('data-message-author-role','user');row.setAttribute('data-message-id','user-'+n);row.textContent=message;user.append(row);messages.append(user);
 // Opt-in current native public-message model, separate from the DOM/model menu fixture.
 // Completion comes from this synthetic model, never from detecting a Copy button.
 const native=window.fixtureNativeMessages?{status:'in_progress',items:[{type:'user-message',messageId:'user-'+n,message},
  {type:'assistant-message',messageId:'assistant-'+n,phase:'final_answer',completed:false,content:'Fixture partial: '+message}]}:null;
 if(native)user.__reactFiber$fixture={memoizedProps:{conversationId:fixtureLocation.pathname.split('/c/')[1],turn:native},return:null};
 const stop=document.createElement('button');stop.setAttribute('data-testid','stop-button');stop.textContent='Stop';box.closest('form').append(stop);stop.onclick=()=>{clearTimeout(replyTimer);if(native)native.status='complete';stop.remove()};
 replyTimer=setTimeout(()=>{const sec=document.createElement('section');sec.setAttribute('data-testid','conversation-turn-a'+n);const answer=document.createElement('div');answer.setAttribute('data-message-author-role','assistant');answer.setAttribute('data-message-id','assistant-'+n);answer.textContent='Fixture answer: '+message;if(native){native.items[1].content=answer.textContent;native.items[1].completed=true;native.status='complete';}const copy=document.createElement('button');copy.setAttribute('data-testid','copy-turn-action-button');copy.textContent='Copy';sec.append(answer,copy);messages.append(sec);stop.remove();},window.fixtureLong?60000:350);
};
</script></body></html>
